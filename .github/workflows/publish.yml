name: Publish to npm

# Triggered by pushing a tag of the form `v1.2.3`. The actual version
# in the tarball is read from packages/cli/package.json — make sure
# you bump it (`npm version` in packages/cli) before tagging.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Verify NPM_TOKEN is configured
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN repository secret is empty or not set."
            echo "::error::Add it at: https://github.com/shmulikdav/SolariX/settings/secrets/actions"
            echo "::error::It must be a Repository secret (not an Environment secret)."
            exit 1
          fi
          echo "NPM_TOKEN length: ${#NPM_TOKEN} (expecting ~40 chars for a granular token)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Fetch web textures
        # Best-effort: package still works without textures (UI falls back
        # to procedural rendering), but the bespoke advisor planets need
        # the CC-licensed textures to look right.
        run: pnpm --filter @solix/web prepare-assets || echo "::warning::Texture fetch failed; package will ship with procedural fallback"

      - name: Build (server, shared, web, cli)
        run: pnpm -r build

      - name: Inspect tarball
        working-directory: packages/cli
        run: npm pack --dry-run

      - name: Publish
        # Write the auth token explicitly into a project-local .npmrc so
        # there's no ambiguity about whether setup-node's config reached
        # this step. Then publish from packages/cli.
        working-directory: packages/cli
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
